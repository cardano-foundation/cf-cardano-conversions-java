name: Run Tests

on:
  push:
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '25' ]
    name: Verify (JDK ${{ matrix.java }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

